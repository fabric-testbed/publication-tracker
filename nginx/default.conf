# the upstream component nginx needs to connect to
upstream django {
    # use for local-ssl deployment
    #server host.docker.internal:8000; # TCP socket
    # use for docker deployment
    server pubtrkr-django:8000;
}


# Catch-all for any Host header that matches no server_name above. 444 closes the
# connection without a response.
#
# Without it the TLS vhost below is `default_server` and therefore answers to *any*
# Host, which is what made the `server_name $host:8443` line meaningless (nginx does not
# interpolate variables in server_name, so that value was a literal that never matched)
# and what let a forged Host reach the redirect in @error401.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate           /etc/ssl/fullchain.pem;
    ssl_certificate_key       /etc/ssl/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name 127.0.0.1 localhost;
    return 301 https://$server_name:8443$request_uri;
}

server {
    listen   443 ssl;
    # Real names, not a variable. A deployment reached by any other name points
    # NGINX_DEFAULT_CONF at its own copy (see nginx/default.conf.prod-example) rather
    # than editing this file -- adding a name here would otherwise be the one tracked
    # file every host has to modify.
    server_name 127.0.0.1 localhost;

    # Enable support for TLS 1.2 and/or 1.3
    ssl_protocols  TLSv1.2 TLSv1.3;

    # If they come here using HTTP, bounce them to the correct scheme
    error_page 497 https://$server_name$request_uri;
    # Or if you're on the default port 443, then this should work too
    # error_page 497 https://;

    # Let's Encrypt format (ref: )
    ssl_certificate           /etc/ssl/fullchain.pem;
    ssl_certificate_key       /etc/ssl/privkey.pem;
    ssl_trusted_certificate   /etc/ssl/chain.pem;

    charset     utf-8;

    # set max header size
    large_client_header_buffers 4 32k;

    # max upload size
    client_max_body_size 75M;   # adjust to taste

    # Cache configuration
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 5;
    open_file_cache_errors off;

    location = /validate {
        # forward the /validate request to Vouch Proxy
        proxy_pass http://vouch-proxy:9090/validate;

        # be sure to pass the original host header
        proxy_set_header Host $http_host;

        # Vouch Proxy only acts on the request headers
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        ### AUTH REQUEST SET ###
        # optionally add X-Vouch-User as returned by Vouch Proxy along with the request
        auth_request_set $auth_resp_x_vouch_user $upstream_http_x_vouch_user;

        # optinally add X-Vouch-IdP-IdToken, X-Vouch-IdP-AccessToken or X-Vouch-IdP-RefreshToken
        auth_request_set $auth_resp_x_vouch_idp_idtoken $upstream_http_x_vouch_idp_idtoken;
        #auth_request_set $auth_resp_x_vouch_idp_accesstoken $upstream_http_x_vouch_idp_accesstoken;
        #auth_request_set $auth_resp_x_vouch_idp_refreshtoken $upstream_http_x_vouch_idp_refreshtoken;

        # these return values are used by the @error401 call
        auth_request_set $auth_resp_jwt $upstream_http_x_vouch_jwt;
        auth_request_set $auth_resp_err $upstream_http_x_vouch_err;
        auth_request_set $auth_resp_failcount $upstream_http_x_vouch_failcount;
    }

    # if validate returns `401 not authorized` then forward the request to the error401block
    error_page 401 = @error401;

    location @error401 {
        proxy_set_header Host $http_host;
        # redirect to Vouch Proxy for login
        # Built from $server_name, and without the Vouch JWT.
        #
        # $host is the client's Host header: a request carrying `Host: evil.com` used to
        # produce `302 http://evil.com:9090/login?...&X-Vouch-Token=<jwt>`, handing the
        # session credential to whoever sent it. The JWT has no business in a URL in any
        # case -- query strings reach access logs, Referer headers and browser history.
        # Vouch starts a fresh login without it.
        return 302 https://$server_name:8443/login?url=https://$server_name:8443$request_uri&vouch-failcount=$auth_resp_failcount&error=$auth_resp_err;
    }

    location /auth {
        # redirect to Vouch Proxy for authentication with OIDC client
        # Callback URL (relative to host) must be defined in both OIDC client and vouch/config
        proxy_pass http://vouch-proxy:9090/auth;
    }

    location /login {
        # these return values are used by the @error401 call
        auth_request_set $auth_resp_jwt $upstream_http_x_vouch_jwt;
        auth_request_set $auth_resp_err $upstream_http_x_vouch_err;
        auth_request_set $auth_resp_failcount $upstream_http_x_vouch_failcount;

        # redirect to Vouch Proxy for login
        proxy_pass http://vouch-proxy:9090/login?url=$scheme://$http_host;
    }

    location /logout {
        # redirect to Vouch Proxy for logout
        proxy_pass http://vouch-proxy:9090/logout?url=$scheme://$http_host;
    }

    # Django media
    location /media  {
        alias /code/media;  # your Django project's media files - amend as required
    }

    location /static {
        alias /code/static; # your Django project's static files - amend as required
    }

    # Finally, send all non-media requests to the Django server.
    location / {
        # CORS - accept all preflight OPTIONS checks.
        # Access-Control-Allow-Credentials was set unconditionally, for every origin
        # nginx answered. Paired with the loopback entries that used to sit permanently
        # in CORS_ALLOWED_ORIGINS, that let a page the visitor was running locally read
        # authenticated responses from this deployment. Django owns credentialed CORS
        # now (CORS_ALLOW_CREDENTIALS in settings.py), so nginx does not assert it.
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range';
        add_header 'Access-Control-Max-Age' 1728000;

        # send all requests to the `/validate` endpoint for authorization
        auth_request /validate;
        proxy_set_header X-Vouch-User $auth_resp_x_vouch_user;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        proxy_buffers 8 24k;
        proxy_buffer_size 2k;

        # nginx defaults uwsgi_read_timeout to 60s and publicationtrkr.ini sets no
        # harakiri, so a slow request is cut off by nginx alone. A bulk upload at the
        # record cap is the first request in this app that can legitimately run for
        # minutes -- each record is one insert, plus a core-api project lookup per
        # distinct project uuid. Raised here so a large upload finishes instead of
        # returning 504 with part of the batch already written.
        uwsgi_read_timeout 600s;
        uwsgi_send_timeout 600s;

        uwsgi_pass  django;
        include     /code/uwsgi_params; # the uwsgi_params file
    }
}